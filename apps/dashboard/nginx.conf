server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — react-router-dom's BrowserRouter needs every path to
    # resolve to index.html and let client-side routing take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
