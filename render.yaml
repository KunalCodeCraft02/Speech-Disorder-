services:
  # apps-phone.onrender.com — Vite/React SPA (react-router-dom BrowserRouter).
  # Needs every path rewritten to index.html so client-side routing can take
  # over; without this, Render's static file server 404s on any route besides
  # "/" (e.g. /session, /calibrate).
  - type: web
    name: apps-phone
    runtime: static
    rootDir: apps/phone
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # apps-dashboard.onrender.com — same BrowserRouter SPA situation as
  # apps-phone above: "/" works but any client-side route (e.g. /patients)
  # 404s on Render's static file server without this rewrite.
  - type: web
    name: apps-dashboard
    runtime: static
    rootDir: apps/dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
