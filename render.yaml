services:
  # apps-phone.onrender.com — offline-first PWA (Vite/React, HashRouter).
  # This is now the entire product: a single-user, single-device speech
  # biofeedback app with no backend (see apps/phone/README.md). Hosting it
  # here is optional — the app is also packaged as an installable Android
  # APK via Capacitor (.github/workflows/build-apk.yml) and works with no
  # server at all once installed.
  - type: web
    name: apps-phone
    runtime: static
    rootDir: apps/phone
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
